<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Песочница «Рыбацкая деревушка»</title>
<style>

html,body{height:100%}
:root{background:var(--bg)}

  -webkit-user-select:none;user-select:none;touch-action:none}
#scene{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}

  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud.top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.hud.bottom{bottom:0;justify-content:center;flex-wrap:wrap;gap:6px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.plate{background:var(--plate);border:2px solid var(--plate-edge);box-shadow:0 2px 0 rgba(0,0,0,.45);padding:5px 9px;line-height:1.15}
.plate .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.plate .val{font-size:17px;font-weight:600;color:var(--ink)}
.plate .wnd{font-size:12px;color:var(--dim);margin-top:2px}
#wx .wnd b{color:var(--amber);font-weight:600;font-family:system-ui,sans-serif;display:inline-block;width:1.1em;text-align:center}
button{pointer-events:auto;font:inherit;font-size:12px;color:var(--ink);background:var(--plate);border:2px solid var(--plate-edge);
  padding:5px 7px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.45)}
button b{color:var(--amber);font-weight:600}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;max-width:calc(100vw - 32px)}
#hint .val{font-size:15px}
#hint[hidden],#loading[hidden],#devPanel[hidden],#stick[hidden],#devCopy[hidden]{display:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
#loading .plate{font-size:15px;padding:10px 16px}
#devPanel{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));
  max-width:min(560px,calc(100vw - 24px));font:12px/1.4 ui-monospace,Menlo,monospace;pointer-events:auto}
#devPanel div{margin:1px 0}
#devPick{color:#ffe2a0;user-select:text;-webkit-user-select:text}
#devPanel button{margin-top:4px;font-family:inherit}
#keys{color:var(--dim)}
#stick{position:fixed;width:100px;height:100px;border-radius:50%;border:2px solid rgba(242,228,200,.35);background:rgba(24,17,12,.25);pointer-events:none;z-index:5}
#knob{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:rgba(242,228,200,.45);border:2px solid rgba(90,58,34,.9)}
#map{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(92px + env(safe-area-inset-top,0px));width:96px;height:128px;image-rendering:pixelated;border:2px solid var(--plate-edge);background:var(--plate);pointer-events:none}

  <div class="plate" id="wx" style="text-align:right"><div class="lbl">Погода</div><div class="val" id="wxName">Ясно</div><div class="wnd" id="wind">—</div></div>
</div>
<div id="hint" class="plate" hidden><div class="val" id="hintName"></div><div class="wnd" id="hintText"></div></div>
<div id="devPanel" class="plate" hidden>
  <div id="devRider"></div><div id="devStats"></div><div id="devPick"></div>
  <button id="devCopy" type="button" hidden>Скопировать</button>
  <div id="keys">стрелки / WASD — ехать, пробел — тормоз, X — откатить назад, G — сетка, P — пауза</div>
</div>
<div id="stick" hidden><div id="knob"></div></div>
<div class="hud bottom">

</div>

const BARK={
  brown:P(['#241a14','#3f3026','#5e4a3a','#7f6752']),
  grey:P(['#262322','#433e3b','#655e58','#8a827a']),

const LEAF_GREEN=P(['#1d3016','#2e4a1d','#456a27','#638a34','#8cae4c']),LEAF_YG=P(['#2e3615','#4d5a1d','#76842a','#a2a83a','#cfcd5e']),

const LITTERK=.79;

// ================= sprite buffers =================
class Spr{
  constructor(w,h){this.w=w|0;this.h=h|0;this.d=new Uint8ClampedArray(this.w*this.h*4)}
  set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=this.w||y>=this.h)return;const i=(y*this.w+x)*4;this.d[i]=c[0];this.d[i+1]=c[1];this.d[i+2]=c[2];this.d[i+3]=c[3]===undefined?255:c[3]}
  get(x,y){const i=(y*this.w+x)*4;return[this.d[i],this.d[i+1],this.d[i+2],this.d[i+3]]}
  has(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return false;return this.d[(y*this.w+x)*4+3]>0}
  mul(x,y,f){if(!this.has(x,y))return;const i=(y*this.w+x)*4;this.d[i]*=f;this.d[i+1]*=f;this.d[i+2]*=f}
  rect(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)this.set(x,y,c)}
  ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry)-1;y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx)-1;x<=cx+rx+1;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c)}}
  line(x0,y0,x1,y1,c,w=1){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);for(let k=0;k<w;k++)this.set(x+k,y,c)}}
  // selective outline: darker on the shadow side (bottom/right), softer on the lit side
  // (the first opaque neighbour, looking up, left, down, right, decides; same result as a loop over the four, but
  // without building little arrays for every pixel, which made this the costliest step of growing a tree)

  crop(){let x0=this.w,y0=this.h,x1=-1,y1=-1;for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)if(this.d[(y*this.w+x)*4+3]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1<0)return{s:this,dx:0,dy:0};const n=new Spr(x1-x0+1,y1-y0+1);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=(y*this.w+x)*4,j=((y-y0)*n.w+(x-x0))*4;for(let c=0;c<4;c++)n.d[j+c]=this.d[i+c]}return{s:n,dx:x0,dy:y0}}

class Tone{ // shading field: value per pixel, owner id per pixel
  constructor(w,h){this.w=w;this.h=h;this.v=new Float32Array(w*h).fill(NaN);this.o=new Int16Array(w*h).fill(-1)}
  ok(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h}
  put(x,y,v,o){if(!this.ok(x,y))return;const i=y*this.w+x;this.v[i]=v;this.o[i]=o}
  at(x,y){return this.ok(x,y)?this.v[y*this.w+x]:NaN}
  own(x,y){return this.ok(x,y)?this.o[y*this.w+x]:-1}
  paint(s,pal,dz=.55){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const v=this.v[y*this.w+x];if(v===v)s.set(x,y,pal[quant(v,x,y,pal.length,dz)])}}
}
const LX=-.55,LY=-.83; // light from upper-left

// Crown of leafy clumps. Each clump: big sphere + scalloped rim of small leaf-bumps. Later clumps sit in front.
function crown(tb,clumps,r){

    const sy=c.sy||1,subs=[],nb=Math.max(5,Math.round(c.R*.95));
    for(let k=0;k<nb;k++){const a=Math.PI*.8+(k/(nb-1))*Math.PI*1.4;subs.push({x:c.x+Math.cos(a)*c.R*.78,y:c.y+Math.sin(a)*c.R*.78*sy,r:c.R*(.34+r()*.1)})}

    const n=subs.length,SX=new Float32Array(n),SY=new Float32Array(n),IR2=new Float32Array(n);for(let q=0;q<n;q++){SX[q]=subs[q].x;SY[q]=subs[q].y;IR2[q]=1/(subs[q].r*subs[q].r)}
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){

// Bare trees bend branch by branch: wind pushes on every segment across its length, so a segment turns toward

  const leafPal=varyPal(r,K.leaf?PAL[K.leaf]:pick(r,[PAL.crimson,PAL.gold,PAL.rowan,PAL.orange])),leafPts=[];

// ================= undergrowth & props =================
// A sprite buffer with a hidden margin: the generator draws in its own coordinates as before, but strokes that
// reach past the nominal edge (a bent grass blade, a fern tip, an outline pixel) land in the margin instead of
// being cut off flat. The anchor is shifted by the margin, and the empty border is cropped away later.
class PSpr extends Spr{constructor(w,h,mx,my){super(w+2*mx,h+2*my);this.ox=mx;this.oy=my}
  set(x,y,c){super.set(Math.round(x)+this.ox,Math.round(y)+this.oy,c)}
  get(x,y){return super.get(x+this.ox,y+this.oy)}
  has(x,y){return super.has(x+this.ox,y+this.oy)}
  mul(x,y,f){x+=this.ox;y+=this.oy;if(!super.has(x,y))return;const i=(y*this.w+x)*4;this.d[i]*=f;this.d[i+1]*=f;this.d[i+2]*=f}}

}
function genGrass(r,seed,hint,sw=0){

// then it is seen the way the camera sees the forest: ground straight down onto the screen, height pushed up the
// screen by R3B per pixel. Every solid is sampled densely on its surface at 3x resolution, the nearest sample wins

// ================= sound: real field recordings, mixed live =================
// Research notes behind this design:
//  - realism comes from real recordings, not synthesis: every texture here is a field recording (CC0 / Pixabay
//    licence, see snd/CREDITS.txt), cut to its steadiest stretch, levelled to one loudness and looped with a 3-second
//    equal-power crossfade baked in at load time, so there is no seam and no click;
//  - nothing should repeat audibly: each loop plays as two copies started far apart and panned apart (a wide,
//    decorrelated stereo image from one mono file), layers of unrelated lengths are mixed, and rare events
//    (woodpecker, owl, drips, the crunch under the tyre) are short pieces of recordings fired at random times
//    with small random pitch, level, position and distance, never the same piece twice in a row;
//  - calm comes from the mix, not from processing: soft treble (low "sharpness" is rated more pleasant), no sudden
//    loud events, weather changes crossfading over seconds, a stream preferred over louder water, sparse autumn birds
//    that fall silent in rain, and a very slow, barely-there swell of the whole bed (~0.07 Hz, like breathing).

[Math.round(u*A*hf+.6*Math.sin(k*2.39+ci*1.9)*hf),Math.round(.5*Math.sin(k*1.7+ci*2.3)*hf)]})}\n// All eight poses of one plant are worked out together. Small bushes sway so little that two poses could round to\n// the same pixels; then one of the upper clumps is nudged by a pixel (a leaf cluster lifting or dropping), so\n// every frame is a different drawing and the bush never seems to stall.\nfunction swayOffsets(cs,k){if(!cs.offs){const n=cs.clumps.length,seen=new Set(),all=[];\n    const order=cs.clumps.map((c,i)=>i).sort((a,b)=>cs.clumps[a].y-cs.clumps[b].y);\n    for(let f=0;f<NF;f++){const o=rawOffsets(cs.clumps,f,cs.A,cs.top,cs.bottom);\n      for(let tries=0;seen.has(o.join());tries++){const j=order[(f+tries)%Math.max(1,Math.ceil(n*.6))];o[j][(tries>>1)%2]+=(f+tries)%2?1:-1;if(tries>40)break}\n      seen.add(o.join());all.push(o)}cs.offs=all}\n  return cs.offs[k]}\nfunction sprDiff(a,b){let d=0;for(let i=3;i<a.d.length;i+=4)if(a.d[i]!==b.d[i]||a.d[i-3]!==b.d[i-3]||a.d[i-2]!==b.d[i-2])d++;return d}\n// A pose may still come out looking like an earlier one when the clump that moved is hidden behind others;\n// then the next visible top clump is nudged a pixel and the pose drawn again, until it is a new picture.\nfunction uniqueCrownFrame(cs,k,prev){let s=crownFrame(cs,k);const need=6;\n  const order=cs.clumps.map((c,i)=>i).sort((a,b)=>cs.clumps[a].y-cs.clumps[b].y);\n  for(let t=0;t<8;t++){let worst=1e9;for(const p of prev)worst=Math.min(worst,sprDiff(s,p));if(worst>=need)break;\n    const j=order[t%Math.min(order.length,3)];cs.offs[k][j][t&2?1:0]+=(k+t)%2?1:-1;s=crownFrame(cs,k)}\n  return s}\nfunction uniquePlantFrame(c,k,prev){let s;for(let t=0;t<5;t++){s=MAKERS[c.type](mulberry(c.seed),c.seed,c.hint,swayU(k)+(t?(t%2?1:-1)*.07*Math.ceil(t/2):0),k+t*3).s;\n    let worst=1e9;for(const p of prev)worst=Math.min(worst,sprDiff(s,p));if(worst>=4)break}return s}\nfunction crownFrame(cs,k){const s=new Spr(cs.base.w,cs.base.h);s.d.set(cs.base.d);\n  const offs=swayO 2e',.7]],\n  needle:[['#b47a40',1.4],['#c88a44',1],['#e0b440',.7],['#86603a',.8]],\n  curl:[['#8c6a42',1.3],['#6e5236',1],['#b09a70',.7],['#9a5a30',.6]],\n};\nconst lmix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t].map(v=>Math.round(clamp(v,0,255)));\n// a leaf kind: species, shape, and its tones; made into a fixed pool, each kind with its pixel lists per turn\nconst LKINDS=[],LKBYSP={};\nfunction lkMake(sp,shi,mid,two,spot,fade){const SH=LSHAPES[sp][shi],B=mid,K={id:LKINDS.length,sp,shi,two,spot,fade};\n  K.tone={'#':B,L:lmix(B,[255,236,180],.32),D:lmix(B,[30,16,10],.38),v:lmix(B,[40,20,10],.22),s:lmix(B,[70,46,26],.6),T:two?lmix(two,[255,220,170],.1):lmix(B,[255,236,180],.32)};\n  K.back=lmix(lmix(B,[200,190,160],.28),[0,0,0],.08); // the paler underside, seen as a leaf tumbles\n  K.edge=K.tone.D;K.rots=[];\n  const pts=[];SH.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')pts.push([x,y,ch])}));const w=SH[0].length,h=SH.length;\n  if(spot){const body=pts.filter(p=>p[2]==='#');if(body.length){const p=body[Math.floor(body.length/2)];p[2]='X';K.tone.X=[42,32,24]}}\n  for(let r=0;r<8;r++){const P=[];for(const[x,y,ch]of pts){let X=x,Y=y;if(r&4)X=w-1-X;const q=r&3;let a=X,b=Y;\n      if(q===1){a=h-1-Y;b=X}else if(q===2){a=w-1-X;b=h-1-Y}else if(q===3){a=Y;b=w-1-X}\n      // light always comes from the upper left: on a turned leaf the lit and shaded edges are re-chosen by where they lie\n      P.push([a,b,ch])}\n    const W=(r&1)?h:w,H=(r&1)?w:h;for(const p of P){if(p[2]==='L'||p[2]==='D'){p[2]=(p[0]+p[1])<(W+H)/2-1?'L':'D'}}K.rots.push({P,W,H})}\n  LKINDS.push(K);(LKBYSP[sp]||(LKBYSP[sp]=[])).push(K);return K}\n{const r=mulberry(77123);for(const sp of LSPEC){for(const[hexc,wt]of LCOL[sp]){const base=hx(hexc);for(let shi=0;shi<LSHAPES[sp].length;shi++)for(let j=0;j<2;j++){\n    const mid=shiftPal([base],(r()-.5)*14,(r()-.5)*.2,(r()-.5)*.08)[0];\n    const two=sp==='maple'&&r()<.3?hx(r()<.5?'#c42a26':'#e8582a'):sp==='aspen'&&r()<.25?hx('#e8c04 [rot&7];\n  cv=document.createElement('canvas');cv.width=R.W;cv.height=R.H;const g=cv.getContext('2d'),img=g.createImageData(R.W,R.H),d=img.data,af=age*.12;\n  for(const[a,b,ch]of R.P){let c=face?K.back:K.tone[ch]||K.tone['#'];if(face&&ch==='D')c=lmix(c,[0,0,0],.15);if(af)c=lmix(c,[96,64,38],af);const i=(b*R.W+a)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}\n  g.putImageData(img,0,0);LSPR.set(key,cv);return cv}\n// a falling leaf tumbles: face, turning edge-on, its pale back, edge-on again; it also turns slowly as it goes\nfunction drawLeafK(l,x,y){const K=LKINDS[l.k];\n  if(l.state===0){const f=Math.sin(l.ph),rot=(l.rot+Math.floor(l.ph2||0))&7;\n    if(Math.abs(f)<.35){ctx.fillStyle=l.es||(l.es=`rgb(${K.edge})`);const R=K.rots[rot];if((rot&1)===0)ctx.fillRect(x,y+(R.H>>1),Math.max(2,R.W-1),1);else ctx.fillRect(x+(R.W>>1),y,1,Math.max(2,R.H-1));return}\n    ctx.drawImage(lkCanvas(K,rot,f<0?1:0,0),x,y);return}\n  ctx.drawImage(lkCanvas(K,l.rot,0,l.age||0),x,y)}\n// fall behaviour by species: light small leaves drift and flutter, oak and linden fall quicker, needles drop straight\nconst LFALL={maple:[1,1],oak:[1.35,.8],linden:[1.2,.9],birch:[.75,1.5],aspen:[.85,1.35],rowan:[1,1.1],needle:[1.6,.4],curl:[1.25,.9]};\n// a tree's litter: leaves of its own species and colour, scattered under its crown, a little faded\nfunction litterFrom(r,n,rad,pal,ell=.55,sp){const L=[];if(!sp){let best='curl',bd=1e9;for(const q of['maple','oak','birch','aspen','rowan','linden','curl']){const c=lkPick(q,r,pal[3]).tone['#'],d=(c[0]-pal[3][0])**2+(c[1]-pal[3][1])**2+(c[2]-pal[3][2])**2;if(d<bd){bd=d;best=q}}sp=best}\n  for(let i=0;i<n;i++){const a=r()*6.283,d=Math.sqrt(r())*rad,K=r()<.12?lkPick('curl',r):lkPick(sp,r,pal[2+Math.floor(r()*3)]);L.push([Math.round(Math.cos(a)*d),Math.round(Math.sin(a)*d*ell),K.id,Math.floor(r()*8),r()*.35])}return L}\n\n// ================= trees =================\nconst TPL={\n  round:[[-.22,.36,.3],[.24,.34,.3],[0,.17,.32],[-.3,.6,.27],[.28,.58,.28],[0,.52,.34]],\n  oak:[[-.3,.42,.27],[.3,.4,.27],[-.1,.2,.28],[.16,.22,.26],[-.36,.63,.23],[.36,.65,.23],[0,.6,.32]],\n  tall:[[0,.13,.27],[-.17,.33,.29],[.18,.36,.29],[0,.54,.33],[-.16,.72,.25],[.15,.74,.25]],\n  small:[[-.2,.38,.31],[.21,.36,.31],[0,.16,.3],[0,.6,.35]],\n};\nfunction buildClumps(r,tpl,cx,top,CW,CHt,flip,scale=1){\n  return tpl.map(([nx,ny,nr])=>({x:cx+flip*(nx+(r()-.5)*.06)*CW,y:top+(ny+(r()-.5)*.05)*CHt,R:nr*CW*(.92+r()*.16)*scale})).sort((a,b)=>a.y-b.y);\n}\n// ================= trees: many kinds, shapes and ages =================\n// Every tree is grown from a few choices: its species, its form (how its crown is built and how many stems it has),\n// its age (a sapling, a grown tree, an old giant; hint.sz from the forest), and its own shade of colour. A broadleaf\n// crown is a set of leaf clumps spread over one or more envelopes (ellipses): a round crown, a vase, a wide flat-topped\n// old crown, a crown leaning to one side, a crown in separate tiers with the limbs showing between, two crowns on a\n// forked trunk, a narrow column, a weeping birch, a clump of birch stems. The clumps still sway one by one (as before).\n// A crown may be two-toned: maples redden from the top and the outside, birches and aspens turn unevenly.\n// Spruces and larches are built tier by tier (each tier its own length on either side, drooping, the old ones bare at\n// the foot with dead twigs), pines grow cloud-like tufts at the ends of crooked limbs on a trunk that turns orange\n// toward the top.\n\n// a tapering limb or stem\nfunction limb(s,x0,y0,x1,y1,w0,w1,c,c2){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)));\n  for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t,w=Math.max(1,Math.round(w0+(w1-w0)*t)),xa=Math.round(x-w/2+.01);\n    for(let k=0;k<w;k++)s.set(xa+k,Math.round(y),c2&&k===w-1&&w>1?c2:c)}}\n// leaf clumps over an ellipse: a big one in its heart, smaller ones spread out to its rim, never piled on each other\nfunction envClumps(r,E,out){const pts=[{x:E.x,y:E.y+E.ry*.12,R:Math.max(5,E.R1)}];\n  for(let tries=0;pts.length<E.n&&tries<E.n*60;tries++){const a=r()*6.283,d=Math.sqrt(r())*.86,px=E.x+Math.cos(a)*d*E.rx,py=E.y+Math.sin(a)*d*E.ry;\n    if(E.flat&&py<E.y-E.ry*(1-E.flat)*.86)continue;\n    const R=Math.max(4.4,E.R0+(E.R1-E.R0)*(1-d)*(.75+.5*r()));let ok=true;\n    for(const q of pts)if(Math.hypot(q.x-px,(q.y-py)*1.1)<(q.R+R)*.56){ok=false;break}\n    if(ok)pts.push({x:px+(E.skew||0)*(py-E.y),y:py,R})}\n  for(const p of pts)out.push({x:p.x,y:p.y,R:p.R,sy:E.sy||1,env:E.id||0})}\n// paint a crown clump by clump, each with its own palette (two-toned crowns)\nfunction paintOwn(tb,s,cs){for(let y=0;y<tb.h;y++)for(let x=0;x<tb.w;x++){const i=y*tb.w+x,v=tb.v[i];if(v!==v)continue;\n  const p=cs.pals[cs.tints[tb.o[i]]||0];s.set(x,y,p[quant(v,x,y,p.length,.55)])}}\n// stems: ordinary bark, a birch's white bark with black marks, an aspen's smooth grey-green bark with dark diamonds\nfunction stemBirch(s,bx,ty,base,tw,seed,lean){for(let y=Math.round(ty);y<=base;y++){const t=(y-ty)/Math.max(1,base-ty),ww=tw+(t>.88?1:0),x0=Math.round(bx+lean*(1-t)-ww/2);\n  for(let k=0;k<ww;k++){let c=BARK.birch[k===0?3:k===ww-1?1:2];if(t>.86&&h2(x0+k,y,seed)<(t-.86)*6)c=[60+((h2(k,y,seed)*30)|0),54,50];s.set(x0+k,y,c)}\n  if(h2(y,7,seed)<.13&&t<.86){const sd=h2(y,9,seed)<.5?1:Math.max(1,ww-2);s.set(x0+sd,y,[58,52,50]);if(ww>2&&h2(y,8,seed)<.5)s.set(x0+sd+(sd>1?-1:1),y,[96,90,86])}}}\nfunction stemAspen(s,bx,ty,base,tw,seed,lean,AB){for(let y=Math.round(ty);y<=base;y++){const t=(y-ty)/Math.max(1,base-ty),ww=tw+(t>.9?1:0),x0=Math.round(bx+lean*(1-t)-ww/2);\n  for(let k=0;k<ww;k++)s.set(x0+k,y,AB[k===0?3:k===ww-1?0:ww>3&&k===ww-2?1:2]);\n  if(h2(y,11,seed)<.1&&t<.9){const m=x0+(ww>>1);s.set(m,y,[40,40,34]);s.set(m-1,y-1,[62,64,54]);s.set(m+1,y-1,[62,64,54])}if(t>.93)s.set(x0+(ww>>1),y,AB[0])}}\n\n// ---------- broadleaf trees ----------\n// o: {sz, CW, CH, trunkH, tw, form, pal, pal2, tint ('top'|'outer'|'random'|''), share (of the second tone), bark,\n//     stem ('bark'|'birch'|'aspen'), A, rows, berries, litterN}\nfunction broadleaf(r,seed,o){\n  const CW=o.CW,CH=o.CH,trunkH=o.trunkH,pad=Math.ceil(CW*.35)+8,w=Math.ceil(CW*1.5)+pad*2,h=Math.ceil(CH+trunkH+CW*.25)+8,s=new Spr(w,h),cx=w/2,base=h-2,flip=r()<.5?-1:1;\n  const yb=base-trunkH,yt=yb-CH,cy=(yt+yb)/2,E=[],stems=[];let bx=cx+(r()-.5)*2;\n  const nC=a=>Math.max(3,Math.round(a*(.8+.4*r())));\n  switch(o.form){\n    case 'round':E.push({x:cx,y:cy,rx:CW*.5,ry:CH*.5,n:nC(7),R0:CW*.17,R1:CW*.3});stems.push([bx,cx,cy+CH*.12]);break;\n    case 'oval':E.push({x:cx,y:cy,rx:CW*.42,ry:CH*.48,n:nC(6),R0:CW*.2,R1:CW*.32});stems.push([bx,cx,cy+CH*.15]);break;\n    case 'column':E.push({x:cx,y:cy,rx:CW*.3,ry:CH*.48,n:nC(6),R0:CW*.19,R1:CW*.28,sy:1.1});stems.push([bx,cx,cy+CH*.2]);break;\n    case 'spread':E.push({x:cx,y:cy+CH*.05,rx:CW*.62,ry:CH*.42,n:nC(10),R0:CW*.13,R1:CW*.24,flat:.3});\n      stems.push([bx,cx+flip*CW*.04,cy+CH*.25]);break;\n    case 'vase':E.push({x:cx,y:yt+CH*.34,rx:CW*.55,ry:CH*.32,n:nC(7),R0:CW*.15,R1:CW*.26,id:0});E.push({x:cx-flip*CW*.06,y:yb-CH*.22,rx:CW*.26,ry:CH*.22,n:nC(3),R0:CW*.13,R1:CW*.2,id:1});\n      stems.push([bx,cx,yt+CH*.5]);break;\n    case 'lop':{const off=flip*CW*.2;E.push({x:cx+off,y:cy-CH*.05,rx:CW*.45,ry:CH*.44,n:nC(7),R0:CW*.15,R1:CW*.27,id:0});E.push({x:cx-off*.9,y:cy+CH*.22,rx:CW*.2,ry:CH*.2,n:nC(2),R0:CW*.12,R1:CW*.17,id:1});\n      bx=cx-flip*2;stems.push([bx,cx+off*.5,cy+CH*.1]);break}\n    case 'layers':{const k=r()<.5?2:3;for(let i=0;i<k;i++){const t=(i+.5)/k,sd=(i%2?-1:1)*flip;\n      E.push({x:cx+sd*CW*.1,y:yt+CH*t,rx:CW*(.3+.18*t),ry:CH*.4/k,n:nC(4),R0:CW*.12,R1:CW*.2,id:i,sy:.85})}stems.push([bx,cx,yt+CH*.2]);break}\n    case 'twin':{const dx=CW*.24;E.push({x:cx-dx,y:cy+CH*.04,rx:CW*.3,ry:CH*.46,n:nC(5),R0:CW*.13,R1:CW*.22,id:0});E.push({x:cx+dx,y:cy-CH*.06,rx:CW*.3,ry:CH*.48,n:nC(5),R0:CW*.13,R1:CW*.22,id:1});\n      const fy=base-trunkH*.45;stems.push([bx,cx-dx*.9,cy+CH*.15,fy]);stems.push .ox,Math.round(y)+this.oy,c)}\n  get(x,y){return super.get(x+this.ox,y+this.oy)}\n  has(x,y){return super.has(x+this.ox,y+this.oy)}\n  mul(x,y,f){x+=this.ox;y+=this.oy;if(!super.has(x,y))return;const i=(y*this.w+x)*4;this.d[i]*=f;this.d[i+1]*=f;this.d[i+2]*=f}}\nfunction genFern(r,seed,hint,sw=0){\n  const fp=mixPal(FERN_GREEN,PAL.fern,smst((AUT-10)/28)),w=25,h=14,s=new PSpr(w,h,5,3),pal=r()<.75?fp:PAL.straw,bx=12,by=h-1,n=5+Math.floor(r()*2);\n  for(let i=0;i<n;i++){const sd=(i/(n-1))*2-1+(r()-.5)*.2,L=8+r()*3,Hh=(9+r()*2)*(1-Math.abs(sd)*.45);\n    let px=bx,py=by;\n    for(let t=1;t<=L;t++){const u=t/L,x=bx+sd*L*u*1.05+sw*2.2*u*u,y=by-Hh*Math.sin(u*Math.PI*.78)+Math.abs(sw)*.6*u*u;\n      s.line(px,py,x,y,pal[1]);\n      if(t>1&&t<L&&(t&1)){const l=Math.max(1,Math.round((1-u)*2.2)),dx=x-px,dy=y-py,m=Math.hypot(dx,dy)||1,nx=-dy/m,ny=dx/m;\n        for(let k=1;k<=l;k++){s.set(x+nx*k,y+ny*k+.4,pal[2]);s.set(x-nx*k,y-ny*k+.4,pal[3])}}\n      px=x;py=y}\n    s.set(px,py+1,pal[pal.length-1])}\n  s.outline(.42,.62);return{s,ax:bx+s.ox,ay:by+s.oy,shadowR:7};\n}\nfunction genGrass(r,seed,hint,sw=0){\n  const w=14,h=13,s=new PSpr(w,h,6,4),n=11+Math.floor(r()*5),dry=r()<SE.dry;\n  for(let i=0;i<n;i++){const pal=dry||(i%3===0)?PAL.straw:PAL.sedge,bx=3+r()*(w-6),hh=5+r()*7,bend=(r()-.5)*4,shade=1+(i&1);\n    for(let t=0;t<=hh;t++){const u=t/hh,x=bx+(bend+sw*2.6*(.8+.4*((i*7)%5)/4))*u*u,y=h-1-t;s.set(x,y,pal[t<2?0:u>.75?Math.min(3,shade+1):shade]);if(t<2)s.set(x+1,y,pal[0])}}\n  s.outline(.5,.7);return{s,ax:7+s.ox,ay:h-1+s.oy,shadowR:5};\n}\nfunction genPile(r,seed){\n  const w=Math.round(11+r()*7),h=6,s=new PSpr(w+2,h+2,2,2);\n  const sps=[pick(r,['maple','oak','birch','aspen','linden']),pick(r,['maple','birch','curl']),'curl'];\n  for(let i=0;i<w*2.4;i++){const a=r()*3.14,d=Math.sqrt(r()),x=1+w/2+Math.cos(a)*d*w/2-1.5,y=h-Math.sin(a)*d*(h-1)-1,K=lkPick(sps[Math.floor(r()*r()*3)],r);lkStamp((xx,yy,c)=>s.set(xx,yy,c),Math.round(x),Math.round(y),K,Math.floor(r()*8),r()*.3)}\n  s.outline(.42,.62);return{s,ax:Math.round(w/2)+1+s.ox,ay:h+s.oy,shadowR:w*.5};\n}\n// ---------- shrubs ----------\nfunction genBush(r,seed,hint,sw,k){ // leafy autumn bush (hazel, euonymus, viburnum...)\n  const ph=phen('bush',seed);\n  const CW=11+r()*10,w=Math.ceil(CW*1.9)+6,h=Math.ceil(CW*1.3)+6,s=new Spr(w,h),tb=new Tone(w,h),cx=w/2,flip=r()<.5?-1:1,bb=h-3;\n  const pal=seasonPal(varyPal(r,wpick(r,[[PAL.crimson,2],[PAL.orange,2],[PAL.rowan,2],[PAL.oak,1.5],[PAL.gold,1.2],[PAL.maple,1]])),ph);\n  const nc=3+Math.floor(r()*3),cl=[];for(let i=0;i<nc;i++)cl.push({x:cx+(r()-.5)*CW*.7,y:bb-CW*(.15+r()*.3),R:CW*(.22+r()*.12),sy:.75+r()*.15});\n  const clumps=cl.sort((a,b)=>a.y-b.y),br=mulberry(seed+7);\n  const berryFn=br()<.35?(rest=>{const bc=pick(br,[[[196,26,34],[120,14,22]],[[40,30,60],[20,14,30]],[[230,120,30],[150,60,14]]]),L=[];for(let i=0;i<6;i++){const x=Math.round(cx+(br()-.5)*CW*.7),y=Math.round(bb-CW*(.1+br()*.4));if(rest.at(x,y)===rest.at(x,y))L.push([[x,y,bc[0]],[x+1,y,bc[1]]])}return L}):null;\n  return{s,cs:{base:s,clumps,layers:[],r:mulberry(seed+3),berryFn,pal,rows:0,clipY:bb,A:1.9,top:bb-CW*.7,bottom:bb,ol:[.36,.58]},ax:Math.round(cx),ay:bb,shadowR:CW*.5};\n}\nfunction genBareBush(r,seed,hint,sw=0,k=3){ // leafless twiggy shrub with a few leaves hanging on; stems bend like the bare trees'\n  const w=60,h=44,s=new Spr(w,h),bx=30,by=h-2,bark=varyPal(r,pick(r,[BARK.brown,BARK.warm,BARK.dark,BARK.grey]),.8),lp=varyPal(r,pick(r,LEAFPALS));let bid=0;\n  const br=(x,y,a,len,d,bend=0)=>{const f=sw*(1+.3*Math.sin(sw*2.2+bid*1.7));bid++;bend-=(d>1?.02:d>0?.04:.07)*f*Math.sin(a+bend)*len/4;\n    const x2=x+Math.cos(a+bend)*len,y2=y+Math.sin(a+bend)*len;s.line(x,y,x2,y2,d>1?bark[2]:bark[1]);\n    if(d>0){const q=r()<.6?2:1;for(let i=0;i<q;i++)br(x2,y2,a+(r()-.5)*1.1,len*(.45+r()*.4),d-1,bend)}else if(r()<.3){s.set(x2,y2,lp[3]);s.set(x2+1,y2,lp[2])}};\n  const n=4+Math.floor(r()*5);for(let i=0;i<n;i++)br(bx+(r()-.5)*5,by,-Math.PI/2+(r()-.5)*1.9,5+r()*7,2);\n  s.outline(.5,0);return{s,ax:bx,ay:by,shadowR:7};\n}\nfunction genJuniper(r,seed){ // low dark blue-green conifer shrub\n  const CW=11+r()*7,Hh=CW*(.7+r()*.5),w=Math.ceil(CW*2.2)+6,h=Math.ceil(Hh)+8,s=new Spr(w,h),tb=new Tone(w,h),cx=w/2,bb=h-3;\n  const pal=varyPal(r,P(['#122320','#1d3630','#2a4b40','#3d6453','#587f68']),.6),nc=4+Math.floor(r()*3),cl=[];\n  for(let i=0;i<nc+2;i++){const t=r();cl.push({x:cx+(r()-.5)*CW*(1.1-t*.6),y:bb-Hh*(.15+t*.55),R:CW*(.3-t*.1)*(.85+r()*.3),sy:.9})}\n  const clumps=cl.sort((a,b)=>a.y-b.y),br=mulberry(seed+7);\n  const berryFn=rest=>{const L=[];for(let i=0;i<8;i++){const x=Math.round(cx+(br()-.5)*CW),y=Math.round(bb-br()*Hh);if(rest.at(x,y)===rest.at(x,y))L.push([[x,y,[96,118,150]]])}return L}; // bluish berries\n  return{s,cs:{base:s,clumps,layers:[],r:mulberry(seed+3),berryFn,pal,rows:0,clipY:bb,A:1.15,top:bb-Hh,bottom:bb,ol:[.36,.58]},ax:Math.round(cx),ay:bb,shadowR:CW*.45};\n}\nfunction genRosehip(r,seed,hint,sw=0){ // arching thorny canes with orange-red hips\n  const w=30,h=20,s=new PSpr(w,h,8,4),bx=15,by=h-2,cane=varyPal(r,P(['#2e1612','#55281c','#7a3c28','#9c5638']),.6),hip=[[226,72,36],[176,40,24],[250,140,90]],lp=varyPal(r,PAL.gold);\n  const n=4+Math.floor(r()*4);\n  for(let i=0;i<n;i++){const sd=(r()-.5)*2,L=10+r()*8,H=8+r()*7;let px=bx+(r()-.5)*3,py=by;\n    for(let t=1;t<=L;t++){const u=t/L,x=bx+sd*L*u*1.1+sw*(2.1+.4*(i%3))*u*u,y=by-H*Math.sin(u*Math.PI*.85);s.line(px,py,x,y,cane[u<.5?2:1]);\n      if(t>2&&r()<.22){s.set(x,y+1,hip[0]);s.set(x+1,y+1,hip[1]);s.set(x,y,hip[2])}else if(t>2&&r()<.12)s.set(x,y-1,lp[3]);px=x;py=y}}\n  s.outline(.5,0);return{s,ax:bx+s.ox,ay:by+s.oy,shadowR:8};\n}\nfunction genLowShrub(r,seed){ // bilberry / cowberry patch: knee-high, tiny leaves, berries\n  const blue=r()<.5,w=Math.round(14+r()*8),h=8,s=new PSpr(w+2,h+2,2,2),pal=blue?varyPal(r,P(['#3a1222','#6a1e30','#9a3040','#c4524c','#e08a6a']),.6):varyPal(r,P(['#13241a','#1f3a26','#2f5434','#4a7444','#6e9658']),.5);\n  for(let y=1;y<=h;y++)for(let x=1;x<=w;x++){const dx=(x-w/2-1)/(w/2),dy=(y-h)/(h-1),e=dx*dx+dy*dy*1.2+(vn(x*.5,y*.5,seed)-.5)*.5;if(e>1)continue;\n    if(h2(x,y,seed)<.12)continue;s.set(x,y,pal[quant(.65-dy*.15-dx*.15+(h2(y,x,seed)-.5)*.6,x,y,5,.7)])}\n  for(let i=0;i<7;i++){const x=1+Math.round(r()*w),y=1+Math.round(r()*h);if(s.has(x,y))s.set(x,y,blue?[52,62,120]:[206,30,40])}\n  s.outline(.45,.62);return{s,ax:Math.round(w/2)+1+s.ox,ay:h+s.oy,shadowR:w*.45};\n}\nfunction genSapling(r,seed){ // a young fir no taller than a person\n  const o=genSpruce(r,seed,r()<.3,true);return{s:o.s,ax:o.ax,ay:o.ay,shadowR:o.shadowR*.8};\n}\n// ---------- stones ----------\nfunction genRock(r,seed){\n  const kind=wpick(r,[['boulder',3],['slab',1.5],['pebbles',1.5],['standing',.7],['split',.8]]),pal=varyPal(r,r()<.6?PAL.stone:PAL.stoneW,.6),mossy=r()<.45;\n  const one=(s,cx,base,rx,ry,sd,facetsN)=>{const cy=base-ry,facets=facetsN||5+Math.floor(r()*3),rot=r()*6.28;\n    for(let y=Math.floor(cy-ry-1);y<=base;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){\n      const dx=(x-cx)/rx,dy=(y-cy)/ry,ang=Math.atan2(dy,dx),rad=1+(vn(ang*1.4+5,1,sd)-.5)*.32,d=Math.sqrt(dx*dx+dy*dy);if(d>rad)continue;\n      const fa=Math.round((ang-rot)/(6.283/facets))*(6.283/facets)+rot,dd=d/rad;let lam=(Math.cos(fa)*LX+Math.sin(fa)*LY)*Math.min(1,dd*1.6);if(dy<-.25&&dd<.55)lam=.55;\n      const q=quant(.52+.36*lam-(dy>.35?.12:0),x,y,5,.4);s.set(x,y,pal[q]);if(dy<-.05&&vn(x*.45,y*.6,sd+9)>(mossy?.42:.6))s.set(x,y,PAL.moss[clamp(q-1,0,3)])}};\n  let s,ax,ay,sh;\n  if(kind==='boulder'){const rx=4.5+r()*6,ry=rx*(.55+r()*.2);s=new Spr(Math.ceil(rx*2)+6,Math.ceil(ry*2)+5);ax=Math.round(rx)+3;ay=s.h-2;one(s,ax,ay,rx,ry,seed);sh=rx}\n  else if(kind==='slab'){const rx=6+r()*6,ry=1.6+r()*1.2;s=new Spr(Math.ceil(rx*2)+6,Math.ceil(ry*2)+5);ax=Math.round(rx)+3;ay=s.h-2;one(s,ax,ay,rx,ry,seed,4);sh=rx}\n  else if(kind==='standing'){const rx=3+r()*2,ry=6+r()*4;s=new Spr(Math.ceil(rx*2)+6,Math.ceil(ry*2)+5);ax=Math.round(rx)+3;ay=s.h-2;one(s,ax,ay,rx,ry,seed,6);sh=rx*1.4}\n  else if(kind==='split'){const rx=5+r()*4,ry=rx*.6;s=new Spr(Math.ceil(rx*2)+8,Math.ceil(ry*2)+5);ax=Math.round(rx)+4;ay=s.h-2;one(s,ax-1,ay,rx*.55,ry,seed);one(s,ax+rx*.5,ay,rx*.5,ry*.9,seed+1);sh=rx}\n  else{s=new Spr(20,9);ax=10;ay=7;const n=3+Math.floor(r()*4);for(let i=0;i<n;i++){const rx=1.5+r()*2.2;one(s,3+r()*14,ay-r()*2,rx,rx*.65,seed+i,5)}sh=7}\n  s.outline(.45,.6);return{s,ax,ay,shadowR:sh};\n}\n// ---------- mushrooms: many kinds and sizes ----------\nfunction mushCap(r,s,x,bY,o){ // o: stemH, stemW, rx, ry, cap palette [dark,mid,light], stem colours, spots, gills\n  const top=bY-o.stemH;\n  for(let y=top;y<=bY;y++){const t=(y-top)/Math.max(1,o.stemH),ww=Math.max(1,Math.round(o.stemW*(1+(o.bulb||0)*t*t)));const x0=Math.round(x-ww/2);\n    for(let k=0;k<ww;k++)s.set(x0+k,y,k===0&&ww>1?o.stem[2]:k===ww-1&&ww>2?o.stem[0]:o.stem[1])}\n  const cy=top-(o.lift||0);\n  for(let y=Math.floor(cy-o.ry);y<=cy+1;y++)for(let xx=Math.floor(x-o.rx-1);xx<=x+o.rx+1;xx++){const dx=(xx-x)/o.rx,dy=(y-cy)/o.ry;\n    if(o.funnel){if(y<cy-o.ry*.8||Math.abs(dx)>1)continue;const lim=.35+.65*((cy-y)/o.ry);if(Math.abs(dx)>lim+.15)continue;s.set(xx,y,y<=cy-o.ry*.6?o.cap[0]:o.cap[dx<0?2:1]);continue}\n    if(dx*dx+dy*dy>1||y>cy+(o.flat?0:.5))continue;const v=.55-dx*.3-dy*.35;s.set(xx,y,o.cap[v>.75?2:v>.4?1:0])}\n  if(o.gills)for(let xx=Math.round(x-o.rx+1);xx<=x+o.rx-1;xx++)s.set(xx,Math.round(cy)+1,o.gills);\n  if(o.spots)for(let i=0;i<o.spots;i++){const a=r()*3.14,d=r()*.8;const sx=Math.round(x+Math.cos(a)*d*o.rx),sy=Math.round(cy-Math.sin(a)*d*o.ry);if(s.has(sx,sy))s.set(sx,sy,[250,244,232])}\n}\nfunction genMush(r,seed,hint){\n  const W_={birch:[['fly',2.2],['chant',1.4],['russula',1],['porcini',.5]],conif:[['fly',1.6],['porcini',1.6],['chant',1.2],['russula',.8]],decid:[['porcini',1.6],['russula',1],['honey',1],['parasol',.6],['puff',.6]],russula:[['russula',3],['puff',.8],['parasol',.5]]};\n  const kind=wpick(r,W_[hint]||[['fly',1.3],['porcini',1.1],['russula',1],['chant',.8],['puff',.6],['honey',.8],['parasol',.4]]),s=new PSpr(22,18,3,3),bY=16;\n  const WH=[[232,226,210],[214,204,184],[248,244,232]],CR=[[214,198,168],[190,172,140],[236,224,200]];\n  const n=kind==='honey'?4+Math.floor(r()*5):kind==='chant'?2+Math.floor(r()*4):kind==='puff'?1+Math.floor(r()*3):1+(r()<.4?1:0);\n  for(let i=0;i<n;i++){const sc=.75+r()*.7,x=11+(i-(n-1)/2)*(kind==='honey'?2:kind==='chant'?3:5)+(r()-.5)*2,yb=bY-(r()<.3?1:0);\n    if(kind==='fly'){const age=r();mushCap(r,s,x,yb,{stemH:Math.round((3+age*3)*sc),stemW:1.6*sc,bulb:.6,rx:(1.8+age*1.6)*sc,ry:(2.2-age*.9)*sc,cap:[[150,22,24],[200,40,32],[236,84,56]],stem:WH,spots:Math.round(3+age*4),gills:[236,228,206],flat:age>.6})}\n    else if(kind==='porcini')mushCap(r,s,x,yb,{stemH:Math.round(3*sc),stemW:2.6*sc,bulb:.5,rx:2.8*sc,ry:2*sc,cap:pick(r,[[[86,48,24],[122,72,36],[156,100,56]],[[110,70,36],[150,100,54],[186,136,80]]]),stem:CR,gills:[200,186,120]});\n    else if(kind==='russula')mushCap(r,s,x,yb,{stemH:Math.round(3*sc),stemW:1.4*sc,rx:2.4*sc,ry:1.4*sc,cap:pick(r,[[[120,20,40],[176,40,58],[214,90,96]],[[80,40,90],[120,64,130],[160,104,160]],[[170,130,30],[214,176,60],[240,212,110]]]),stem:WH,gills:[240,232,214],flat:true});\n    else if(kind==='chant')mushCap(r,s,x,yb,{stemH:Math.round(2*sc),stemW:1.2*sc,rx:1.8*sc,ry:2.2*sc,cap:[[200,120,20],[236,160,40],[250,196,90]],stem:[[200,120,30],[226,150,40],[240,180,70]],funnel:true});\n    else if(kind==='puff'){const rr=(1.3+r()*1.4)*sc;for(let y=-Math.ceil(rr*2);y<=0;y++)for(let xx=-Math.ceil(rr);xx<=rr;xx++){const dx=xx/rr,dy=(y+rr)/rr;if(dx*dx+dy*dy>1)continue;s.set(x+xx,yb+y,WH[dx<-.2&&dy<0?2:dy>.4?1:0])}if(r()<.5)s.set(x,yb-Math.round(rr*1.6),[180,170,150])}\n    else if(kind==='honey'){const lean=(i-(n-1)/2)*.6;mushCap(r,s,x+lean,yb,{stemH:Math.round((3+r()*3)*sc),stemW:1,rx:1.5*sc,ry:1.2*sc,cap:[[120,84,40],[168,124,64],[204,166,100]],stem:CR,flat:true,spots:1})}\n    else mushCap(r,s,x,yb,{stemH:Math.round(7*sc),stemW:1,bulb:1,rx:3.6*sc,ry:1.6*sc,cap:[[140,110,80],[200,176,140],[230,214,186]],stem:CR,gills:[236,228,210],flat:true,spots:3});\n  }\n  s.outline(.38,.55);return{s,ax:11+s.ox,ay:bY+s.oy,shadowR:4};\n}\n// ---------- stumps ----------\nfunction genStump(r,seed){\n  const kind=wpick(r,[['cut',2],['hollow',1.3],['mossy',1],['birch',1],['broken',1],['honey',.8]]);\n  const w=7+Math.floor(r()*6),bh=kind==='broken'?7+Math.floor(r()*6):3+Math.floor(r()*4),W2=w+8,H2=bh+12,s=new PSpr(W2,H2,2,3),x0=4,topY=4;\n  const bark=kind==='birch'?BARK.birch:varyPal(r,pick(r,[BARK.brown,BARK.warm,BARK.grey,BARK.dark]),.8);\n  for(let y=topY;y<=topY+bh;y++)for(let k=0;k<w;k++){let t=k===0?2:k===1?3:k>=w-1?0:k>=w-3?1:2;if(t>0&&h2(x0+k,y>>1,seed)<.2)t--;let c=bark[t];\n    if(kind==='birch'&&h2(k,y,seed)<.12)c=[56,50,48];s.set(x0+k,y,c)}\n  for(let k=1;k<=2;k++){s.set(x0-k,topY+bh-(2-k),bark[1]);s.set(x0+w-1+k,topY+bh-(2-k),bark[0])} // roots\n  const cx=x0+w/2-.5,cy=topY;\n  if(kind==='broken'){for(let k=0;k<w;k++){const jag=Math.round(r()*4);for(let y=topY-jag;y<topY;y++)s.set(x0+k,y,bark[k<w/2?2:1])}s.set(Math.round(cx),topY-1,PAL.wood[2])}\n  else for(let y=0;y<=topY+1;y++)for(let x=x0;x<x0+w;x++){const dx=(x-cx)/(w/2),dy=(y-cy)/1.9,d=Math.sqrt(dx*dx+dy*dy);if(d>1)continue;\n    let c=d>.82?bark[3]:PAL.wood[Math.floor(d*4)%2?1:2+(dx<0?1:0)];if(kind==='hollow'&&d<.62)c=d<.45?[22,16,12]:[46,32,22];if(kind==='mossy'&&vn(x*.6,y,seed)>.45)c=PAL.moss[1+(dx<0?1:0)];s.set(x,y,c)}\n  if(kind==='cut')s.set(Math.round(cx),cy,PAL.wood[0]);\n  if(kind==='mossy'||r()<.4)for(let k=0;k<w;k++)if(vn(k*.5,3,seed)>.5)s.set(x0+k,topY+bh-Math.floor(r()*3),PAL.moss[1+Math.floor(r()*3)]);\n  if(kind==='honey'){for(let i=0;i<5;i++){const sd=r()<.5?-1:1,y=topY+bh-1-Math.floor(r()*3),xx=sd<0?x0-1-Math.floor(r()*2):x0+w+Math.floor(r()*2);s.set(xx,y,[204,166,100]);s.set(xx+1,y,[168,124,64]);s.set(xx,y+1,[214,198,168])}}\n  else if(r()<.35){const y=topY+2+Math.floor(r()*Math.max(1,bh-2));s.rect(x0+w,y,x0+w+1,y,[214,182,12 +d+yo(x-x0),[210,176,120])}\n  s.outline();return{s,ax:Math.round(x0+L/2)+s.ox,ay:y0+d-1+yo(L/2)+s.oy,shadowR:L*.5};\n}\n// ---------- other forest-floor things ----------\nfunction genAnthill(r,seed){\n  const w=Math.round(12+r()*8),h=Math.round(w*(.55+r()*.15)),s=new PSpr(w+4,h+4,2,2),cx=(w+4)/2,by=h+2,pal=varyPal(r,P(['#3a2414','#5a3a20','#7c5430','#9c7244','#bc9462']),.5);\n  for(let y=2;y<=by;y++)for(let x=0;x<w+4;x++){const dx=(x-cx)/(w/2),dy=(by-y)/h;if(dx*dx*.9+dy*dy*1.1>1||dy<0)continue;\n    s.set(x,y,pal[quant(.5-dx*.3+dy*.25+(h2(x,y,seed)-.5)*.7,x,y,5,.6)])}\n  for(let i=0;i<5;i++){const x=Math.round(cx+(r()-.5)*w*.8),y=Math.round(by-r()*h*.8);if(s.has(x,y))s.set(x,y,[18,12,10])} // ants\n  s.outline(.45,.62);return{s,ax:Math.round(cx)+s.ox,ay:by+s.oy,shadowR:w*.5};\n}\nfunction genBranch(r,seed){ // a fallen crooked branch with twigs\n  const L=14+Math.floor(r()*12),s=new Spr(L+8,12),bark=varyPal(r,pick(r,[BARK.brown,BARK.grey,BARK.warm]),.8),by=8;let x=3,y=by;\n  for(let i=0;i<L;i++){const nx=x+1,ny=clamp(y+(r()<.25?(r()<.5?-1:1):0),5,10);s.set(nx,ny,bark[i<L*.4?2:1]);if(i<L*.4)s.set(nx,ny+1,bark[0]);\n    if(r()<.15){const tl=2+r()*3,a=-Math.PI/2+(r()-.5)*1.4;s.line(nx,ny,nx+Math.cos(a)*tl,ny+Math.sin(a)*tl,bark[1])}x=nx;y=ny}\n  if(r()<.4){const lp=pick(r,LEAFPALS);s.set(x,y-1,lp[3]);s.set(x-4,y-1,lp[2])}\n  s.outline(.5,0);return{s,ax:Math.round(L/2)+3,ay:by+1,shadowR:L*.45};\n}\n\nfunction genReed(r,seed,hint,sw=0){\n  const s=new PSpr(11,14,5,3);for(let i=0;i<5;i++){const x=2+i*1.6,hh=7+Math.floor(r()*5),lean=(r()-.5)*2+sw*(2.2+.3*(i%3));\n    for(let t=0;t<=hh;t++)s.set(x+lean*t/hh,13-t,PAL.sedge[t<2?0:1+(i&1)]);\n    if(i%2===0){const tx=Math.round(x+lean);s.rect(tx,13-hh,tx,15-hh,[110,62,32]);s.set(tx,15-hh,[84,46,24]);s.set(tx,12-hh,PAL.sedge[2])}}\n  s.outline(.42,.62);return{s,ax:5+s.ox,ay:13+s.oy,shadowR:3};\n}\n\n// a wooden signpost at a fork: two boards, one pointing up-left, one up-right\nfunction genSign(r,seed){const s=new PSpr(21,24, ,40,54],beanieD:[106,28,40],beanieL:[186,72,80],pom:[238,226,202],pomD:[196,182,160],\n  hair:[94,58,36],glove:[70,46,32],pants:[88,64,46],pantsD:[64,46,34],boot:[54,40,34],sole:[30,24,22]};\n// 16 frames per pedal turn; the sprite is wider than the rider (ROX each side) so a turned bike fits in it\nconst RIDER_N=16,ROX=16;\n// ================= rider, built as a small 3D model =================\n// The bike and the rider are a handful of simple solids (ellipsoids, tubes, wheels, boxes) placed in the bike's own\n// frame: f ahead of the rear wheel's contact point, s to the right, h up (all in screen pixels). A turn rotates the\n// whole model about the bottom bracket's ground point (so the rider stays on the path) and leans it into the turn;\n// then it is seen the way the camera sees the forest: ground straight down onto the screen, height pushed up the\n// screen by R3B per pixel. Every solid is sampled densely on its surface at 3x resolution, the nearest sample wins\n// each sub-pixel, each pixel takes its majority colour and the sprite gets the same outline as the rest. So the\n// rider, the bike and its wheels always stay one piece, and every heading is the same model, only turned.\nconst R3B=.5,R3SS=3,R3W=32+2*ROX,R3H=44;\nconst R3Z=new Float32Array(R3W*R3SS*R3H*R3SS),R3C=new Int32Array(R3W*R3SS*R3H*R3SS),R3T=new Uint8Array(R3W*R3SS*R3H*R3SS);\nconst rgbI=c=>(c[0]<<16)|(c[1]<<8)|c[2];\nfunction riderPixels(fr,yaw,lean,steer=0){\n  const SS=R3SS,Wd=R3W,Ht=R3H,SW=Wd*SS,SH=Ht*SS,B=R3B,D=Math.PI/180,zb=R3Z,cb=R3C,tb=R3T;zb.fill(-1e9);cb.fill(-1);tb.fill(0);\n  const ys=Math.sin(yaw*D),yc=Math.cos(yaw*D),ls=Math.sin(lean*D),lc=Math.cos(lean*D);\n  // the model's own axes in the world (X right on screen, N away from the camera along the ground, H up)\n  const Fw=[ys,yc,0],Sw=[lc*yc,-lc*ys,-ls],Hw=[ls*yc,-ls*ys,lc];\n  const BBF=8,OX=16+ROX,OY=31.75; // the bottom bracket's ground point sits here on the sprite at every heading\n  // screen x, y (sub-pixels) and nearn   for (const o of VIS) { if (!isFox(o)) continue; const fl = .8 + .2 * Math.sin(t * .7 + o.seed % 31); for (let k = 0; k < 3; k++) { const px = o.x + (h2(o.seed, k, 71) - .5) * Math.min(20, o.mw * .6), py = o.y - 1 - h2(o.seed, k, 72) * 4, g = L.createRadialGradient(px, py, 0, px, py, 5);
      g.addColorStop(0, `rgba(120,255,150,${a * fl})`); g.addColorStop(1, 'rgba(120,255,150,0)'); L.fillStyle = g; L.fillRect(px - 5, py - 5, 10, 10) } } }
function drawFoxDots() { if (LT.dark < .45) return; const a = clamp((LT.dark - .45) / .3, 0, 1); for (const o of VIS) { if (!isFox(o)) continue; for (let k = 0; k < 7; k++) { if (h2(o.seed, k, 73 + Math.floor(t * .5)) < .3) continue; ctx.fillStyle = `rgba(150,255,170,${.55 * a})`;
      ctx.fillRect(Math.round(o.x + (h2(o.seed, k, 71) - .5) * Math.min(20, o.mw * .6)), Math.round(o.y - 1 - h2(o.seed, k, 74) * 5), 1, 1) } } }

// ---- birds over the canopy by day ----
let FLY = [], flyT = 12;
function stepFlyers(dt) { flyT -= dt; if (flyT <= 0) { flyT = (14 + Math.random() * 30) * (1 - .45 * bump(SH, 6, 6.8, 8.5, 9.5)); if (WX.rain < .3 && WX.fog < .6 && LT.day > .5) { const n = 1 + Math.floor(Math.random() * 5), dir = Math.random() < .5 ? 1 : -1, y0 = Math.random() * H * .6, vy = (Math.random() - .5) * 20, v = 38 + Math.random() * 25;
      for (let i = 0; i < n; i++) FLY.push({ x: dir > 0 ? -8 - i * 7 - Math.random() * 6 : W + 8 + i * 7 + Math.random() * 6, y: y0 + i * (3 + Math.random() * 4) * (i % 2 ? 1 : -1), vx: dir * v * (.95 + Math.random() * .1), vy, ph: Math.random() * 6 }) } }
  for (const f of FLY) { f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(t * 2 + f.ph) * 3 * dt; f.ph += dt * (9 + Math.random()) } FLY = FLY.filter(f => f.x > -60 && f.x < W + 60) }

// ---- rain on the water: rings spreading where the drops fall ----
let RINGS = [];
function stepRings(dt) { if (WX.rain < .06) { RINGS = RINGS.filter(r => r.t < r.life); for (const r of RINGS) r.t += dt; return } const cx0 = CAM.x, cy0 = CAM.y;
  for (let k = 0; k < WX.rain * 40 * dt * 6; k++) { const x = cx0 + Math.random() * W, y = cy0 + Math.random() * H, m = matAt(x, y); if (m === 'river' || m === 'lake' || m === 'pond' || m === 'brook' || m === 'bog' && vn(x * .05, y * .05, SEED + 561) < .38) RINGS.push({ x, y, t: 0, life: .5 + Math.random() * .4 }) }
  for (const r of RINGS) r.t += dt; RINGS = RINGS.filter(r => r.t < r.life); if (RINGS.length > 300) RINGS.splice(0, RINGS.length - 300) }
function drawRings() { for (const r of RINGS) { const u = r.t / r.life, rad = 1 + u * 3.5, a = (1 - u) * .5; ctx.fillStyle = `rgba(200,220,228,${a})`; for (let i = 0; i < 8; i++) { const ang = i / 8 * TAU; ctx.fillRect(Math.round(r.x + Math.cos(ang) * rad), Math.round(r.y + Math.sin(ang) * rad * .5), 1, 1) } } }

function stepLife(dt) { stepMoths(dt); stepFlyers(dt); stepRings(dt) }
// over the lit picture: the moths (in the lamplight they shine), the foxfire's specks; the birds over everything
function drawLife() { worldT(); drawFoxDots(); for (const m of MOTHS) { ctx.fillStyle = `rgb(${m.c})`; ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1); if (Math.sin(t * 60 + m.ph) > 0) { ctx.fillRect(Math.round(m.x) - 1, Math.round(m.y), 1, 1); ctx.fillRect(Math.round(m.x) + 1, Math.round(m.y), 1, 1) } }
  scrT(); ctx.fillStyle = 'rgba(38,30,28,.9)'; for (const f of FLY) { const x = Math.round(f.x), y = Math.round(f.y), up = Math.sin(f.ph) > 0; ctx.fillRect(x, y, 1, 1);
    if (up) { ctx.fillRect(x - 1, y - 1, 1, 1); ctx.fillRect(x + 1, y - 1, 1, 1); ctx.fillRect(x - 2, y - 1, 1, 1); ctx.fillRect(x + 2, y - 1, 1, 1) } else { ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x - 2, y + 1, 1, 1); ctx.fillRect(x + 2, y + 1, 1, 1) } } }

})();
